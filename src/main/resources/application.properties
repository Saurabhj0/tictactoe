spring.application.name=tictactoe-global

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tictactoe?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Jlr@2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Spring Boot will auto-detect the library dialect, or we can use the generic one
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

